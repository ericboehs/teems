inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/coverage'

# Test files have longer methods, multiple classes, and flexible naming
Metrics/ClassLength:
  Max: 110
  Exclude:
    - 'test/**/*'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'test/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'test/**/*'

Style/OneClassPerFile:
  Exclude:
    - 'test/**/*'

Naming/MethodName:
  Exclude:
    - 'test/**/*'

Naming/VariableNumber:
  AllowedPatterns:
    - '_\d{3}$'  # HTTP status codes (e.g., retry_after_404)
  Exclude:
    - 'test/**/*'

# Conservative mode flags private helper methods as false positives
Naming/PredicateMethod:
  Enabled: false

Lint/UnusedMethodArgument:
  Exclude:
    - 'test/**/*'

# Reek flags single-char rescue variables; allow descriptive names
Naming/RescuedExceptionsVariableName:
  Enabled: false
