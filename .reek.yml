exclude_paths:
  - .bundle

directories:
  "test":
    TooManyStatements:
      enabled: false

detectors:
  UncommunicativeVariableName:
    accept:
      - e
  UtilityFunction:                                                               
    public_methods_only: true                                                    
  TooManyStatements:                                                             
    max_statements: 10                                                           
  TooManyMethods:                                                                
    max_methods: 20  
