exclude_paths:
  - .bundle
  - test

detectors:
  UtilityFunction:
    public_methods_only: true
  DuplicateMethodCall:
    max_calls: 2
  TooManyStatements:
    max_statements: 7
  TooManyMethods:
    max_methods: 30
  TooManyInstanceVariables:
    max_instance_variables: 5
  LongParameterList:
    max_params: 4
  RepeatedConditional:
    max_ifs: 3
  DataClump:
    max_copies: 3
  UncommunicativeMethodName:
    accept:
      - /404/
      - /v\d+$/
