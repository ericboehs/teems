# CI runs `reek .` (bare `reek` reads stdin when there is no TTY and checks nothing).
# vendor holds CI's bundler-cache gems; tmp is gitignored scratch space.
exclude_paths:
  - .bundle
  - test
  - tmp
  - vendor

detectors:
  TooManyMethods:
    max_methods: 20
  TooManyStatements:
    max_statements: 10
  UncommunicativeVariableName:
    accept:
      - e
  UtilityFunction:
    public_methods_only: true
