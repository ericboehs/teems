exclude_paths:
  - .bundle
  - test

detectors:
  DuplicateMethodCall:
    max_calls: 2
  TooManyStatements:
    max_statements: 7
  TooManyMethods:
    max_methods: 30
  TooManyInstanceVariables:
    max_instance_variables: 5
  LongParameterList:
    max_params: 4
  RepeatedConditional:
    max_ifs: 3
  UncommunicativeMethodName:
    accept:
      - /404/
      - /v\d+$/

  # Disabled: mostly false positives for a CLI app with DI, Data.define models,
  # mixin modules, formatters, and option dispatchers
  NilCheck:
    enabled: false
  BooleanParameter:
    enabled: false
  FeatureEnvy:
    enabled: false
  ControlParameter:
    enabled: false
  InstanceVariableAssumption:
    enabled: false
  Attribute:
    enabled: false
  DataClump:
    enabled: false
  UtilityFunction:
    enabled: false
